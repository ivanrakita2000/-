<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>ПЕРЕКУП — авторынок</title>
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo"><span>◆</span> ПЕРЕКУП</div>
  <div class="top">
    <div class="level">LVL <b id="level">1</b></div>
    <div class="money">₽ <b id="balance">0</b></div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="heroText">
      <div class="eyebrow">ЖИВОЙ АВТОРЫНОК</div>
      <h1>Найди авто.<br><strong>Поймай выгодную сделку.</strong></h1>
      <p>Смотри объявления, разговаривай с продавцами, проверяй историю и решай, когда стоит рискнуть.</p>
      <div class="heroStats">
        <span><b id="marketStat">90</b> моделей</span>
        <span><b id="favoriteStat">0</b> в избранном</span>
      </div>
    </div>
    <div class="heroCar">🚘</div>
  </section>

  <section class="categoryWrap">
    <div class="sectionLabel">МАРКИ</div>
    <div id="brands" class="brands"></div>
  </section>

  <nav class="mainNav">
    <button class="nav active" id="marketTab">Рынок</button>
    <button class="nav" id="favoritesTab">Избранное <span id="favoritesCount">0</span></button>
    <button class="nav" id="garageTab">Гараж <span id="garageCount">0</span></button>
  </nav>

  <section class="filters">
    <div>
      <h2 id="title">Все автомобили</h2>
      <span id="count"></span>
    </div>
    <div class="filterActions">
      <button id="filterOpen">Фильтры</button>
      <button id="reset">Сбросить</button>
    </div>
  </section>

  <section id="filterPanel" class="filterPanel hidden">
    <div class="filterGrid">
      <label>Цена от <input id="priceMin" type="number" min="0" step="10000" placeholder="0"></label>
      <label>Цена до <input id="priceMax" type="number" min="0" step="10000" placeholder="∞"></label>
      <label>Год от <input id="yearMin" type="number" min="1980" max="2026" placeholder="1980"></label>
      <label>Пробег до <input id="mileageMax" type="number" min="0" step="10000" placeholder="∞"></label>
      <label>Коробка
        <select id="gearbox"><option value="">Любая</option><option>МКПП</option><option>АКПП</option><option>DSG</option><option>CVT</option><option>S tronic</option><option>EDC</option></select>
      </label>
      <label>Кузов
        <select id="bodyType"><option value="">Любой</option><option>седан</option><option>хэтчбек</option><option>универсал</option><option>кроссовер</option><option>внедорожник</option><option>минивэн</option></select>
      </label>
      <label>Владельцев до <input id="ownersMax" type="number" min="1" max="10" placeholder="∞"></label>
      <label>Сортировка
        <select id="sortBy"><option value="new">Сначала новые</option><option value="priceAsc">Дешевле</option><option value="priceDesc">Дороже</option><option value="mileageAsc">Меньше пробег</option><option value="yearDesc">Новее</option></select>
      </label>
    </div>
    <button id="applyFilters" class="applyBtn">Применить</button>
  </section>

  <section id="catalog" class="grid"></section>
</main>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"></div>
<script src="app.js"></script>
</body>
</html>
